# Lint, types and tests on every pull request and on main. The PostgreSQL tests
# run against a real server (a service container); the Redshift tests need
# oblako's redshift-local and run locally (see tests/test_redshift.py).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: tests (python ${{ matrix.python }}, postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # every PostgreSQL still supported (the access catalogs change between
        # versions: pg_auth_members in 16, MAINTAIN in 17) on the hooks' Python, and
        # the oldest and newest Python pyproject.toml allows on one PostgreSQL
        include:
          - {python: "3.12", postgres: "14"}
          - {python: "3.12", postgres: "15"}
          - {python: "3.12", postgres: "16"}
          - {python: "3.12", postgres: "17"}
          - {python: "3.12", postgres: "18"}
          - {python: "3.10", postgres: "16"}
          - {python: "3.13", postgres: "16"}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: sesame
          POSTGRES_PASSWORD: sesame
          POSTGRES_DB: sesame
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sesame" --health-interval 2s
          --health-timeout 5s --health-retries 30
    env:
      PGSESAME_TEST_DSN: postgresql://sesame:sesame@localhost:5432/sesame
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --locked --python ${{ matrix.python }}

      - name: Hooks (ruff, pydocstyle, ty)
        if: matrix.python == '3.12' && matrix.postgres == '16'
        run: uvx prek run --all-files --show-diff-on-failure

      - name: Tests
        run: uv run pytest -q

  redshift:
    name: redshift (oblako's redshift-local)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # signing in to AWS, for ECR Public's account pull allowance
    env:
      # pinned by digest: :16 moves with every oblako image change. To update,
      # docker buildx imagetools inspect public.ecr.aws/oblako/redshift-local:16
      # (oblako 0.5.0: CREATEUSER with PASSWORD DISABLE refused, CREATE USER,
      # ALTER USER, DROP USER and CREATE ROLE system permissions; 0.4.1: ALTER
      # DEFAULT PRIVILEGES ... IN SCHEMA refused to an owner that can't create
      # there, Data API batch errors as on AWS; 0.4.0:
      # ACCESS SYSTEM TABLE for non-superusers, pg_group listing only groups;
      # since 0.3.0 a role at PUBLIC's masking priority replaces
      # PUBLIC, Data API sessions and its 40-statement batches, names to 127
      # bytes, CONNECT refused, names folded to lower case, ALTER/DROP
      # privileges, sys:* roles)
      IMAGE: public.ecr.aws/oblako/redshift-local:16@sha256:14dbc95d851db3f296572ecb31f2d2c03b3f5ee260161701b31a84a220ce9092
      PGSESAME_TEST_REDSHIFT_DSN: host=localhost port=5439 user=oblako password=oblako dbname=oblako sslmode=require
      # anonymous pulls share 500 GB a month and have run out ("Data limit
      # exceeded"); signed in, the account's 5 TB. A fork's pull request gets no
      # AWS sign-in and pulls anonymously
      SIGNED_IN: ${{ vars.ECR_PUBLIC_ROLE_ARN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to AWS
        if: env.SIGNED_IN == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ECR_PUBLIC_ROLE_ARN }}
          aws-region: us-east-1  # ECR Public's sign-in is in us-east-1

      - name: Log in to ECR Public
        if: env.SIGNED_IN == 'true'
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      # a step, not a service container: services start before any step, so
      # before the login
      - name: Start redshift-local
        run: >-
          docker run -d --name redshift -p 5439:5439
          -e POSTGRES_USER=oblako -e POSTGRES_PASSWORD=oblako -e POSTGRES_DB=oblako
          "$IMAGE"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --locked

      - name: Wait for redshift-local (the proxy starts after its first-run setup)
        run: |
          for i in $(seq 1 90); do
            uv run python -c "import os, psycopg; psycopg.connect(os.environ['PGSESAME_TEST_REDSHIFT_DSN'], connect_timeout=3).execute('select 1 from svv_roles limit 1')" 2>/dev/null && exit 0
            sleep 2
          done
          echo "redshift-local did not come up"; docker logs redshift | tail -50; exit 1

      - name: Redshift tests
        run: uv run pytest -q tests/test_redshift.py tests/test_masking.py

  action:
    name: the GitHub Action (uses ./)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # the plan comment
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sesame
          POSTGRES_PASSWORD: sesame
          POSTGRES_DB: sesame
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sesame" --health-interval 2s
          --health-timeout 5s --health-retries 30
    env:
      SESAME_DSN: postgresql://sesame:sesame@localhost:5432/sesame
    steps:
      - uses: actions/checkout@v4

      - name: A schema to grant on
        run: psql "$SESAME_DSN" -c "CREATE SCHEMA app; CREATE TABLE app.t (id int)"

      - name: Plan (changes expected)
        id: plan
        uses: ./
        with:
          command: plan
          spec: tests/action/permissions.yaml
          package: .  # this checkout, not the published release

      - name: The plan found the changes
        env:
          HAS_CHANGES: ${{ steps.plan.outputs.has-changes }}
          TO_ADD: ${{ steps.plan.outputs.to-add }}
        run: test "$HAS_CHANGES" = true && test "$TO_ADD" = 5

      - name: Apply the change set
        uses: ./
        with:
          command: apply
          package: .

      - name: Plan again (nothing expected)
        id: again
        uses: ./
        with:
          command: plan
          spec: tests/action/permissions.yaml
          package: .
          comment: "false"
          artifact: ""

      - name: The database matches the spec
        env:
          HAS_CHANGES: ${{ steps.again.outputs.has-changes }}
        run: test "$HAS_CHANGES" = false
