# Lint, types and tests on every pull request and on main. The PostgreSQL tests
# run against a real server (a service container); the Redshift tests need
# oblako's redshift-local and run locally (see tests/test_redshift.py).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: tests (python ${{ matrix.python }}, postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # every PostgreSQL still supported (the access catalogs change between
        # versions: pg_auth_members in 16, MAINTAIN in 17) on the hooks' Python, and
        # the oldest and newest Python pyproject.toml allows on one PostgreSQL
        include:
          - {python: "3.12", postgres: "14"}
          - {python: "3.12", postgres: "15"}
          - {python: "3.12", postgres: "16"}
          - {python: "3.12", postgres: "17"}
          - {python: "3.12", postgres: "18"}
          - {python: "3.10", postgres: "16"}
          - {python: "3.13", postgres: "16"}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: sesame
          POSTGRES_PASSWORD: sesame
          POSTGRES_DB: sesame
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sesame" --health-interval 2s
          --health-timeout 5s --health-retries 30
    env:
      PGSESAME_TEST_DSN: postgresql://sesame:sesame@localhost:5432/sesame
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --locked --python ${{ matrix.python }}

      - name: Hooks (ruff, pydocstyle, ty)
        if: matrix.python == '3.12' && matrix.postgres == '16'
        run: uvx prek run --all-files --show-diff-on-failure

      - name: Tests
        run: uv run pytest -q

  redshift:
    name: redshift (oblako's redshift-local)
    runs-on: ubuntu-latest
    services:
      redshift:
        # pinned by digest: :16 moves with every oblako image change. To update,
        # docker buildx imagetools inspect public.ecr.aws/oblako/redshift-local:16
        # (oblako 0.2.0: masking as on Redshift Serverless, svv_column_privileges)
        image: public.ecr.aws/oblako/redshift-local:16@sha256:5c61fe25ff7f2b3eb23fc1e261f9cb3e8420f6f1373a6b661644a20215e36f21
        env:
          POSTGRES_USER: oblako
          POSTGRES_PASSWORD: oblako
          POSTGRES_DB: oblako
        ports: ["5439:5439"]
    env:
      PGSESAME_TEST_REDSHIFT_DSN: host=localhost port=5439 user=oblako password=oblako dbname=oblako sslmode=require
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --locked

      - name: Wait for redshift-local (the proxy starts after its first-run setup)
        run: |
          for i in $(seq 1 90); do
            uv run python -c "import os, psycopg; psycopg.connect(os.environ['PGSESAME_TEST_REDSHIFT_DSN'], connect_timeout=3).execute('select 1 from svv_roles limit 1')" 2>/dev/null && exit 0
            sleep 2
          done
          echo "redshift-local did not come up"; exit 1

      - name: Redshift tests
        run: uv run pytest -q tests/test_redshift.py tests/test_masking.py

  action:
    name: the GitHub Action (uses ./)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # the plan comment
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sesame
          POSTGRES_PASSWORD: sesame
          POSTGRES_DB: sesame
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sesame" --health-interval 2s
          --health-timeout 5s --health-retries 30
    env:
      SESAME_DSN: postgresql://sesame:sesame@localhost:5432/sesame
    steps:
      - uses: actions/checkout@v4

      - name: A schema to grant on
        run: psql "$SESAME_DSN" -c "CREATE SCHEMA app; CREATE TABLE app.t (id int)"

      - name: Plan (changes expected)
        id: plan
        uses: ./
        with:
          command: plan
          spec: tests/action/permissions.yaml
          package: .  # this checkout, not the published release

      - name: The plan found the changes
        env:
          HAS_CHANGES: ${{ steps.plan.outputs.has-changes }}
          TO_ADD: ${{ steps.plan.outputs.to-add }}
        run: test "$HAS_CHANGES" = true && test "$TO_ADD" = 5

      - name: Apply the change set
        uses: ./
        with:
          command: apply
          package: .

      - name: Plan again (nothing expected)
        id: again
        uses: ./
        with:
          command: plan
          spec: tests/action/permissions.yaml
          package: .
          comment: "false"
          artifact: ""

      - name: The database matches the spec
        env:
          HAS_CHANGES: ${{ steps.again.outputs.has-changes }}
        run: test "$HAS_CHANGES" = false
