# Publish pgsesame to PyPI when a version tag is pushed (git tag v0.1.0 && git push
# origin v0.1.0). Trusted publishing: PyPI trusts this workflow through GitHub's
# OIDC token, so no API token is stored anywhere. The publish job runs in the
# `pypi` environment, which can require a reviewer's approval before it starts.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: The tag matches the package version
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}"
            exit 1
          fi

      - name: Build the wheel and the source archive
        run: uv build

      - name: Check the distributions
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pgsesame/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
