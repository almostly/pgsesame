# Run on demand: uvx pre-commit run --all-files
# Install the git hooks: uvx pre-commit install --hook-type pre-commit --hook-type commit-msg
repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.4
    hooks:
      - id: commitizen        # validate the message format: Area(+|~|-): description
        stages: [commit-msg]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        files: ^src/pgsesame/.*\.py$
