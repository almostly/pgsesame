# Hooks for prek (or pre-commit, which reads the same file).
# Run on demand: uvx prek run --all-files
# Install the git hooks: uvx prek install --hook-type pre-commit --hook-type commit-msg
repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.4
    hooks:
      - id: commitizen        # validate the message format: Area(+|~|-): description
        stages: [commit-msg]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle        # the docstrings' style; a missing one on public names
        files: ^src/pgsesame/.*\.py$

  - repo: local
    hooks:
      - id: docstrings
        name: docstrings (private and nested too)
        # pydocstyle asks for a docstring only on public names; this asks everywhere
        entry: uv run --frozen pytest -q tests/test_docstrings.py
        language: system
        files: ^src/pgsesame/.*\.py$
        pass_filenames: false

      - id: ty
        name: ty check
        # through uv, so ty resolves imports against the project's environment
        entry: uv run --frozen ty check src tests
        language: system
        types: [python]
        pass_filenames: false
